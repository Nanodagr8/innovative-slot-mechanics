apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uranus-spins
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uranus-spins
  minReplicas: { { .Values.hpa.minReplicas } }
  maxReplicas: { { .Values.hpa.maxReplicas } }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: { { .Values.hpa.targetCPUUtilizationPercentage } }
