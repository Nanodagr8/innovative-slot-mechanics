apiVersion: apps/v1
kind: Deployment
metadata:
  name: uranus-app
  namespace: uranus-spins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: uranus
  template:
    metadata:
      labels:
        app: uranus
    spec:
      containers:
        - name: uranus-app
          image: ghcr.io/nanostudios/uranus-spins-server:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: uranus-svc
  namespace: uranus-spins
spec:
  selector:
    app: uranus
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
