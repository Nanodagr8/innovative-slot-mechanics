apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-runner
  namespace: uranus-spins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-role
  namespace: uranus-spins
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-rolebinding
  namespace: uranus-spins
subjects:
  - kind: ServiceAccount
    name: backup-runner
    namespace: uranus-spins
roleRef:
  kind: Role
  name: backup-role
  apiGroup: rbac.authorization.k8s.io
