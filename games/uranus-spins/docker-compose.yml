version: "3.8"
services:
  app:
    build: 
      context: ./server
      dockerfile: Dockerfile
    image: uranus-spins-server:local
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HMAC_SECRET=dev_secret_change_me
      - PG_HOST=postgres
      - PG_PORT=5432
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=uranus
      - POSTGRES_USER=uranus
      - POSTGRES_PASSWORD=uranus_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
